{% extends 'base.html' %}

{% block title %}Edit Donation — {{ donation.title }}{% endblock %}

{% block content %}
<div class="dashboard-layout">
  
  <aside class="dashboard-sidebar">
    <div class="sidebar-heading">Donor Portal</div>
    <a href="{{ url_for('donor.dashboard') }}" class="sidebar-nav-item">
      <i class="bi bi-grid-fill"></i> Dashboard
    </a>
    <a href="{{ url_for('donor.donations') }}" class="sidebar-nav-item active">
      <i class="bi bi-box-seam"></i> My Donations
    </a>
    <a href="{{ url_for('donor.requests') }}" class="sidebar-nav-item">
      <i class="bi bi-inbox"></i> Donation Requests
    </a>
  </aside>

  <main class="dashboard-main">
    <div class="mb-4 pb-3 border-bottom" style="border-color: var(--border-color) !important;">
      <h2 class="fw-bold text-white mb-1">Edit Donation Listing</h2>
      <p class="text-secondary small mb-0">Modify details, pickup instructions, or allergens for this active listing.</p>
    </div>

    <div class="fs-card p-4 p-lg-5" style="max-width: 900px;">
      <form method="POST" action="{{ url_for('donor.edit', donation_id=donation._id) }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label class="form-label">Food Title *</label>
            <input type="text" class="form-control" name="title" value="{{ donation.title }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Category *</label>
            <select class="form-select" name="category" required>
              {% for cat in categories %}
                <option value="{{ cat }}" {% if donation.category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description *</label>
          <textarea class="form-control" name="description" rows="3" required>{{ donation.description }}</textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Allergens</label>
            <input type="text" class="form-control" name="allergens" value="{{ donation.allergens }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Storage Instructions</label>
            <input type="text" class="form-control" name="storage_instructions" value="{{ donation.storage_instructions }}">
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Pickup Start</label>
            <input type="text" class="form-control" name="pickup_start" value="{{ donation.pickup_start }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Pickup End</label>
            <input type="text" class="form-control" name="pickup_end" value="{{ donation.pickup_end }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Packaging</label>
            <input type="text" class="form-control" name="packaging_details" value="{{ donation.packaging_details }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Pickup Address</label>
          <input type="text" class="form-control" name="pickup_address" value="{{ donation.pickup_address }}">
        </div>

        <div class="mb-4">
          <label class="form-label">Update Food Photo (Optional)</label>
          <input type="file" class="form-control" name="image" accept="image/*">
        </div>

        <div class="d-flex gap-3">
          <button type="submit" class="btn btn-share-green px-4">
            Save Listing Updates
          </button>
          <a href="{{ url_for('donor.donations') }}" class="btn btn-share-outline">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}
