{% extends 'base.html' %}

{% block title %}Access Denied (403) — FoodShare{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">

    <div class="display-1 fw-bold text-danger mb-2">403</div>
    <h3 class="fw-bold text-white mb-2">Access Denied</h3>

  </div>
</div>
{% endblock %}
