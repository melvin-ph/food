{% extends 'base.html' %}

{% block title %}Server Error (500) — FoodShare{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="fs-card p-5 mx-auto" style="max-width: 580px;">
    <div class="display-1 fw-bold text-warning mb-2">500</div>
    <h3 class="fw-bold text-white mb-2">Internal Server Error</h3>
    <p class="text-secondary small mb-4">
      An unexpected condition occurred while processing this request. Our engineering team has logged the event.
    </p>
    <a href="{{ url_for('public.index') }}" class="btn btn-share-green">
      <i class="bi bi-house-door me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
