{% extends 'base.html' %}

{% block title %}Page Not Found (404) — FoodShare{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="fs-card p-5 mx-auto" style="max-width: 580px;">
    <div class="display-1 fw-bold text-success mb-2">404</div>
    <h3 class="fw-bold text-white mb-2">Page Not Found</h3>
    <p class="text-secondary small mb-4">
      The food listing or page you requested may have been collected, expired, or relocated.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('public.index') }}" class="btn btn-share-green">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
      <a href="javascript:history.back()" class="btn btn-share-outline">
        Go Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
